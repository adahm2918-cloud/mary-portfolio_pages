<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CashWise | Mary Adah</title>
  <style>
    :root { --ink: #161b24; --muted: #677082; --paper: #f6f7fb; --card: #fff; --accent: #4a66e8; --green: #178f68; --line: #e1e4ed; }
    * { box-sizing: border-box; } body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 Arial, sans-serif; }
    .app { width: min(1040px, calc(100% - 40px)); margin: 0 auto; padding: 28px 0 60px; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 42px; } .brand { font-weight: 800; font-size: 1.25rem; } .brand span { color: var(--accent); } .back { color: var(--muted); font-weight: 700; text-decoration: none; }
    .hero { display: grid; grid-template-columns: 1.4fr .8fr; gap: 20px; margin-bottom: 20px; } .balance { padding: 34px; border-radius: 8px; background: var(--ink); color: white; } .balance p { margin: 0 0 12px; color: #c4cad7; } .balance strong { display: block; font-size: clamp(2.4rem, 6vw, 4.5rem); line-height: 1; } .balance small { color: #c4cad7; }
    .summary { display: grid; gap: 14px; } .stat { padding: 20px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); } .stat span { color: var(--muted); } .stat strong { display: block; margin-top: 6px; font-size: 1.4rem; } .income { color: var(--green); } .expense { color: #bd3b52; }
    .content { display: grid; grid-template-columns: .8fr 1.2fr; gap: 20px; } .panel { padding: 24px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); } h1, h2 { margin: 0; letter-spacing: 0; } h1 { margin-bottom: 24px; font-size: 1.4rem; } h2 { font-size: 1.1rem; }
    form { display: grid; gap: 12px; } input, select { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 5px; background: #fff; font: inherit; } button { padding: 12px 16px; border: 0; border-radius: 5px; background: var(--accent); color: white; font: inherit; font-weight: 800; cursor: pointer; }
    .transactions { margin-top: 18px; } .transaction { display: flex; justify-content: space-between; gap: 12px; padding: 15px 0; border-bottom: 1px solid var(--line); } .transaction:last-child { border: 0; } .transaction span { color: var(--muted); font-size: .85rem; } .transaction strong { display: block; } .amount { text-align: right; } .remove { margin-top: 5px; padding: 0; background: transparent; color: #9099aa; font-size: .78rem; }
    @media (max-width: 720px) { .app { width: min(100% - 28px, 1040px); } .hero, .content { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main class="app">
    <header><div class="brand">Cash<span>Wise</span></div><a class="back" href="../index.html#work">Back to portfolio</a></header>
    <section class="hero"><div class="balance"><p>Available balance</p><strong id="balance">$0.00</strong><small>Updated whenever a transaction is added</small></div><div class="summary"><div class="stat"><span>Income</span><strong class="income" id="income">$0.00</strong></div><div class="stat"><span>Expenses</span><strong class="expense" id="expenses">$0.00</strong></div></div></section>
    <section class="content"><aside class="panel"><h1>Add a transaction</h1><form id="entry-form"><input id="name" required maxlength="45" placeholder="Description"><input id="amount" required type="number" min="0.01" step="0.01" placeholder="Amount"><select id="type"><option value="income">Income</option><option value="expense">Expense</option></select><button type="submit">Save transaction</button></form></aside><section class="panel"><h2>Recent activity</h2><div id="transactions" class="transactions"></div></section></section>
  </main>
  <script>
    const key = 'mary-cashwise';
    let entries = JSON.parse(localStorage.getItem(key)) || [
      { name: 'Website project', amount: 950, type: 'income' }, { name: 'Design tools', amount: 32, type: 'expense' }, { name: 'Consultation', amount: 180, type: 'income' }
    ];
    const money = value => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(value);
    function save() { localStorage.setItem(key, JSON.stringify(entries)); }
    function render() {
      const income = entries.filter(entry => entry.type === 'income').reduce((total, entry) => total + entry.amount, 0);
      const expenses = entries.filter(entry => entry.type === 'expense').reduce((total, entry) => total + entry.amount, 0);
      document.getElementById('income').textContent = money(income); document.getElementById('expenses').textContent = money(expenses); document.getElementById('balance').textContent = money(income - expenses);
      document.getElementById('transactions').innerHTML = entries.map((entry, index) => `<article class="transaction"><div><strong>${entry.name}</strong><span>${entry.type === 'income' ? 'Income' : 'Expense'}</span></div><div class="amount"><strong class="${entry.type}">${entry.type === 'income' ? '+' : '-'}${money(entry.amount)}</strong><button class="remove" data-id="${index}">Remove</button></div></article>`).join('');
      document.querySelectorAll('.remove').forEach(button => button.addEventListener('click', () => { entries.splice(Number(button.dataset.id), 1); save(); render(); }));
    }
    document.getElementById('entry-form').addEventListener('submit', event => { event.preventDefault(); entries.unshift({ name: document.getElementById('name').value.trim(), amount: Number(document.getElementById('amount').value), type: document.getElementById('type').value }); event.target.reset(); save(); render(); }); render();
  </script>
</body>
</html>
